[project]
name = "synthema-fl-server"
version = "0.0.0"
description = "Application containing the component fl-server"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flwr==1.9",
    "pandas>=2.2,<3",
    "mlflow-skinny==2.19",
    "numpy>=1,<2",
    "pydantic>=2.8.2,<3",
    "setuptools>=72.1.0,<73",
    "sqlmodel>=0.0.21,<0.0.22",
    "psutil>=6.0.0,<7",
    "structlog>=25.1.0,<26",
    "aio-pika>=9.5.4,<10",
    "model-store-interface[edge]>=0.5.0",
    "minio>=7.2.20",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-env>=1.1,<2",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.25.3,<0.26",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pip-licenses>=5.0.0,<6",
]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
asyncio_mode = "strict"

[tool.pytest_env]
MLFLOW_URL = { value = "http://localhost:30246", skip_if_set = true }
NODE_NAME = { value = "test", skip_if_set = true }
DATA_PATH = { value = "common/data/iris.csv", skip_if_set = true }
RABBIT_USERNAME = { value = "guest", skip_if_set = true }
RABBIT_PASSWORD = { value = "guest", skip_if_set = true }
RABBIT_HOST = { value = "localhost", skip_if_set = true }

[tool.pytest_coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_server"]
