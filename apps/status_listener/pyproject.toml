[project]
name = "status-listener"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11.0"
sqlmodel = "^0.0.21"
aio-pika = "^9.5.4"
structlog = "^25.1.0"
asyncpg = "^0.30.0"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^0.25.3"
pytest-env = "^1.1.5"
