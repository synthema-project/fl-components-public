[project]
name = "synthema-fl-client"
version = "0.0.0"
description = "Application containing the component fl-client"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flwr>=1.9,<2",
    "pandas>=2.2,<3",
    "setuptools>=72.1.0,<73",
    "psutil>=6.0.0,<7",
    "model-store-interface[edge]>=0.5.0",
    "grpcio-tools>=1.62.0,<2",
    "structlog>=25.1.0,<26",
    "minio>=7.2.20,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-env>=1.1,<2",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "pip-licenses>=5.0.0,<6",
    "pytest-bdd>=7.1.2",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py311"

# Hermetic OS environment variables for Pytest execution
[tool.pytest_env]
MLFLOW_URL = { value = "http://localhost:5000", skip_if_set = true }
NODE_NAME = { value = "pytest-ubuntu-edge", skip_if_set = true }
DATA_PATH = { value = "common/data/iris.csv", skip_if_set = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_client"]
