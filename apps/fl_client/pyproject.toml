[project]
name = "synthema-fl-client"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "scikit-learn==1.9.1",
    "mlflow-skinny>=2.19,<3.0",
    "pandas>=2.2.3,<3",
    "setuptools>=72.1.0,<73.0.0",
    "psutil>=6.0.0,<7.0.0",
    "model-store-interface[edge]==0.6.6",
    "grpcio-tools>=1.62.0,<2.0.0",
    "structlog>=25.1.0,<26.0.0",
    "minio>=7.2.20,<8.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25,<1",
    "sqlmodel>=0.0.21,<0.1",
    "aio-pika>=9.5.4,<10",
    "pytest>=8.2,<9.0",
    "pytest-env>=1.1,<2.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "pip-licenses>=5.0,<6.0",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

# [tool.pytest_env]
# MLFLOW_URL = { value = "http://localhost:30246", skip_if_set = true }
# NODE_NAME = { value = "test", skip_if_set = true }
# DATA_PATH = { value = "common/data/iris.csv", skip_if_set = true }

[tool.ruff]
target-version = "py311"

[project.optional-dependencies]
aml-full = ["model-store-interface[aml]==0.6.5"]
scd-full = ["model-store-interface[scd]==0.6.5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_client"]
