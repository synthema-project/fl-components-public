# Poetry
[tool.poetry]
name = "synthema-fl-restapi"
description = "Application containing the restapi for the federated learning components"
authors = [
    "Borja Arroyo Galende <borja.arroyog@upm.es>"
]
readme = "README.md"
# package-mode = false
version = "0.0.0"
packages = [
    { include = "restapi", from = "src"}
]

[tool.poetry.dependencies]
python = "^3.11.0"
fastapi = "^0.111.1"
python-multipart = "^0.0.9"
sqlmodel = "^0.0.21"
structlog = "^25.1.0"
aiosqlite = "^0.21.0"
aio-pika = "^9.5.4"
greenlet = "^3.1.1"
asyncpg = "^0.30.0"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
fastapi-keycloak = "^1.1.0"
mlflow-skinny = "2.19"
numpy = ">=1.24,<2.0.0"
pandas = ">=2.2.3,<3.0.0"
python-keycloak = "^7.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-env = "^1.1"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
pip-licenses = "^5.0.0"
pytest-asyncio = "^0.25.3"

[tool.mypy]
python_version = "3.11"


# Test
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pytest_coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"

[tool.poetry-dynamic-versioning]
enable = true

# Build system
[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
