[project]
name = "synthema-fl-restapi"
version = "0.0.0"
description = "Application containing the restapi for the federated learning components"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "sqlmodel>=0.0.21,<0.0.22",
    "structlog>=25.1.0,<26",
    "aiosqlite>=0.21.0,<0.22",
    "aio-pika>=9.5.4,<10",
    "greenlet>=3.1.1,<4",
    "asyncpg>=0.30.0,<0.31",
    "python-jose[cryptography]>=3.4.0,<4",
    "fastapi-keycloak>=1.1.0,<2",
    "mlflow-skinny==2.19",
    "python-keycloak>=7.1.1,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-env>=1.1,<2",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pip-licenses>=5.0.0,<6",
    "pytest-asyncio>=0.25.3",
]

[tool.mypy]
python_version = "3.11"

# Test
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pytest_coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"

[tool.pytest_env]
RABBIT_USERNAME = { value = "guest", skip_if_set = true }
RABBIT_PASSWORD = { value = "guest", skip_if_set = true }
RABBIT_HOST = { value = "localhost", skip_if_set = true }
RABBIT_PORT = { value = "5672", skip_if_set = true }
DB_MODE = { value = "sqlite", skip_if_set = true }
KEYCLOAK_SERVER_URL = { value = "http://localhost:8080", skip_if_set = true }
KEYCLOAK_CLIENT_ID = { value = "test-client", skip_if_set = true }
KEYCLOAK_REALM_NAME = { value = "test-realm", skip_if_set = true }
MLFLOW_BASE_URL = { value = "http://localhost:5000", skip_if_set = true }
MLFLOW_TRACKING_USERNAME = { value = "admin", skip_if_set = true }
MLFLOW_TRACKING_PASSWORD = { value = "password", skip_if_set = true }
FL_NODES = { value = "node1,node2", skip_if_set = true }
DATA_CATALOGUE_URL = { value = "http://localhost:8000", skip_if_set = true }
AUTH_DISABLE_TESTS = { value = "False", skip_if_set = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restapi"]
