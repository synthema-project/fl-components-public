[project]
name = "synthema-fl-restapi"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111.1,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "PyYAML>=6.0,<7.0",
    "sqlmodel>=0.0.21,<0.1.0",
    "structlog>=25.1.0,<26.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "aio-pika>=9.5.4,<10.0.0",
    "greenlet>=3.1.1,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "python-jose[cryptography]>=3.4.0,<4.0.0",
    "fastapi-keycloak>=1.1.0,<2.0.0",
    "mlflow-skinny==2.19",
    "numpy>=1.24,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "python-keycloak>=7.1.1,<8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-env>=1.1,<2.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pip-licenses>=5.0,<6.0",
    "pytest-asyncio>=0.25.3,<1.0",
]

[tool.mypy]
python_version = "3.11"


# Test
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pytest_coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restapi"]
