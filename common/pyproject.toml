[project]
name = "synthema-common"
version = "0.0.0"
description = "Shared utilities for the FL applications"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flwr>=1.9,<2",
    "pandas>=2.2.3,<3",
    "mlflow-skinny==2.19",
    "sqlmodel>=0.0.21,<0.1",
    "setuptools>=72.1.0,<73",
    "aio-pika>=9.5.4,<10",
    "docker>=7.1.0,<8",
    "structlog>=25.1.0,<26",
    "model-store-interface[edge]==0.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-env>=1.1,<2",
    "pytest-cov>=5,<6",
    "pytest-asyncio>=0.25.3,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pip-licenses>=5,<6",
    "testcontainers>=4.9.1,<5",
    "pika>=1.3.2,<2",
]

# Common modules are imported through PYTHONPATH=/path/to/fl-components/common.
[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mlflow.*", "cloudpickle.*", "pika.*"]
ignore_missing_imports = true


# Test
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pytest_env]
MLFLOW_URL = { value = "http://localhost:30246", skip_if_set = true }
NODE_NAME = { value = "test", skip_if_set = true }
DATA_PATH = { value = "common/data/iris.csv", skip_if_set = true }

[tool.pytest_coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
