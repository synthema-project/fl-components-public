[project]
name = "synthema-common"
version = "0.0.0"
description = "Package containing utilities for the applications"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flwr>=1.9,<2",
    "pandas>=2.2,<3",
    "mlflow-skinny==2.19",
    "sqlmodel>=0.0.21,<0.0.22",
    "setuptools>=72.1.0,<73",
    "aio-pika>=9.5.4,<10",
    "docker>=7.1.0,<8",
    "structlog>=25.1.0,<26",
    "model-store-interface[edge]>=0.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-env>=1.1,<2",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pip-licenses>=5.0.0,<6",
    "testcontainers>=4.9.1,<5",
    "pika>=1.3.2,<2",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mlflow.*", "cloudpickle.*", "pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pytest_env]
MLFLOW_URL = { value = "http://localhost:30246", skip_if_set = true }
NODE_NAME = { value = "test", skip_if_set = true }
DATA_PATH = { value = "common/data/iris.csv", skip_if_set = true }

[tool.pytest_coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
