apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower-superlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower-superlink
  template:
    metadata:
      labels:
        app: flower-superlink
    spec:
      containers:
        - name: flower-superlink
          image: flwr/superlink:1.9.0
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: flower-superlink
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: flower-superlink
