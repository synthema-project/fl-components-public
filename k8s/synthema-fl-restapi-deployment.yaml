apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthema-fl-restapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synthema-fl-restapi
  template:
    metadata:
      labels:
        app: synthema-fl-restapi
    spec:
      containers:
        - name: synthema-fl-restapi
          image: synthema-fl-restapi:test
          # command: ["python", "-m", "src.restapi.main"]
          env:
            - name: RABBIT_USERNAME
              value: username
            - name: RABBIT_PASSWORD
              value: password
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_PORT
              value: "5672"
            - name: POSTGRES_USERNAME
              value: username
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: DB_ECHO
              value: "true"
            - name: DB_MODE
              value: postgresql
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: synthema-fl-restapi
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: synthema-fl-restapi
