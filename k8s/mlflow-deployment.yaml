apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow
          ports:
            - containerPort: 80
          command:
            [
              "mlflow",
              "server",
              "--host",
              "0.0.0.0",
              "--port",
              "80",
              "--serve-artifacts",
              "--artifacts-destination",
              "file:///artifacts",
              "--backend-store-uri",
              "sqlite:///store.db",
            ]
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /artifacts
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: mlflow

