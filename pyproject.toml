[project]
name = "fl-global"
version = "0.2.0"
description = "A global venv for running format and lint tools"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "docker>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9", "pytest-asyncio>=0.25.3,<1", "pytest-env>=1.1,<2",
    "pytest-cov>=5,<6", "ruff>=0.5,<1", "mypy>=1.10,<2", "PyYAML>=6,<7",
]

[tool.uv]
package = false
required-version = "==0.11.19"

[tool.uv.workspace]
members = ["common", "apps/fl_server", "apps/fl_client", "apps/restapi", "apps/status_listener", "e2e"]

[tool.uv.sources]
model-store-interface = { index = "synthema" }
synth-privacy = { index = "synthema" }
sd-fidelity = { index = "synthema" }
safe-validation = { index = "synthema" }
sd-metrics = { index = "synthema" }

[[tool.uv.index]]
name = "synthema"
url = "https://pypi.synthema.rid-intrasoft.eu/simple/"
explicit = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py311"
