[project]
name = "fl-global"
version = "0.2.0"
description = "A global venv for running format and lint tools"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "docker>=7.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "apps/fl_server", "apps/fl_client", "apps/restapi", "apps/status_listener"]

[tool.uv.sources]
model-store-interface = { path = "../app-model_store-interface", editable = true }

# FIXME: Private Synthema PyPI — use when VPN/registry is reachable instead of path above:
# [[tool.uv.index]]
# name = "synthema"
# url = "https://pypi.synthema.rid-intrasoft.eu/simple/"
# explicit = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py311"
