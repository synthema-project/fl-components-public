[project]
name = "fl-global"
version = "0.2.0"
description = "A global venv for running format and lint tools"
authors = [
    { name = "Borja Arroyo Galende", email = "borja.arroyog@upm.es" },
    { name = "Andoni Beristain Iraola", email = "aberistain@vicomtech.org" },
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "docker>=7.1.0"
]

[tool.uv]
package = false


# Poetry
[tool.poetry]
name = "fl-global"
description = "A global venv for running format and lint tools"
authors = [
    "Borja Arroyo Galende <borja.arroyog@upm.es>"
]
readme = "README.md"
package-mode = false
version = "0.0.0"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
docker = "^7.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5"


# Test

[[tool.poetry.source]]
name = "synthema"
url = "https://pypi.synthema.rid-intrasoft.eu/simple/"
priority = "supplemental"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py311"

[tool.poetry-dynamic-versioning]
enable = true

# Build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

