apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: flower-superlink
  name: flower-superlink
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flower-superlink
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: flower-superlink
    spec:
      containers:
        - args:
            - --insecure
          image: flwr/superlink:1.9.0
          name: flower-superlink
          ports:
            - containerPort: 9092
              protocol: TCP
      restartPolicy: Always
