apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: mlflow
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mlflow
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: mlflow
    spec:
      containers:
        - args:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "80"
            - --serve-artifacts
            - --artifacts-destination
            - file:///artifacts
            - --backend-store-uri
            - sqlite:///store.db
          image: ghcr.io/mlflow/mlflow
          name: mlflow
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
