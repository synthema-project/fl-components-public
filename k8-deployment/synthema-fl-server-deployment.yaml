apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: synthema-fl-server
  name: synthema-fl-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: synthema-fl-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: synthema-fl-server
    spec:
      containers:
        - args:
            - python
            - -m
            - src.fl_server.main
            - --superlink
            - flower-superlink:9091
          env:
            - name: MLFLOW_URL
              value: http://mlflow
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_PASSWORD
              value: password
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USERNAME
              value: username
          image: synthema-fl-server:test
          name: synthema-fl-server
          ports:
            - containerPort: 9091
              protocol: TCP
          resources:
            limits:
              cpu: "1"
      restartPolicy: Always
