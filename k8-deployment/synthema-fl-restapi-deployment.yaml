apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: synthema-fl-restapi
  name: synthema-fl-restapi
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: synthema-fl-restapi
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: synthema-fl-restapi
    spec:
      containers:
        - env:
            - name: DB_ECHO
              value: "true"
            - name: DB_MODE
              value: postgresql
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USERNAME
              value: username
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_PASSWORD
              value: password
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USERNAME
              value: username
          image: synthema-fl-restapi:test
          name: synthema-fl-restapi
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "1"
      restartPolicy: Always
