services:
  postgres:
    image: bitnami/postgresql
    container_name: postgres
    environment:
      POSTGRESQL_USER: username
      POSTGRESQL_PASSWORD: password
    deploy:
      resources:
        limits:
          cpus: "1"

  rabbitmq:
    image: rabbitmq:3.13.3-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=username
      - RABBITMQ_DEFAULT_PASS=password
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1
    container_name: mlflow
    ports:
      - 10000:80
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,localhost,127.0.0.1"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "80", 
            "--serve-artifacts", "--artifacts-destination", "file:///artifacts",
            "--backend-store-uri", "sqlite:///store.db"]
  
  flower-superlink:
    image: flwr/superlink:1.9.0
    container_name: flower-superlink
    command: ["--insecure"]

  synthema-fl-client:
    image: synthema-fl-client:test
    container_name: synthema-fl-client
    command: ["flower-client-app", "--superlink", "flower-superlink:9092", "--insecure", "src.fl_client.main:app"]
    depends_on:
      flower-superlink:
        condition: service_started
    environment:
      - MLFLOW_URL=http://mlflow
      - NODE_NAME=test
      - DATA_PATH=/common/fl_models/iris/data.csv
    deploy:
      resources:
        limits:
          cpus: "1"
  
  synthema-fl-server:
    image: synthema-fl-server:test
    ports:
      - 9091:9091 # FL server port
    container_name: synthema-fl-server
    command: ["python", "-m", "src.fl_server.main", "--superlink", "flower-superlink:9091"]
    depends_on:
      flower-superlink:
        condition: service_started
      synthema-fl-client:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBIT_USERNAME=username
      - RABBIT_PASSWORD=password
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - MLFLOW_URL=http://mlflow
    deploy:
      resources:
        limits:
          cpus: "1"

  synthema-fl-status_listener:
    image: synthema-fl-status_listener:test
    container_name: synthema-fl-status_listener
    environment:
      - RABBIT_USERNAME=username
      - RABBIT_PASSWORD=password
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_QUEUE=status
      - POSTGRES_USERNAME=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_ECHO=true
    depends_on:
      synthema-fl-restapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"

  synthema-fl-restapi:
    image: synthema-fl-restapi:test
    container_name: synthema-fl-restapi
    environment:
      - RABBIT_USERNAME=username
      - RABBIT_PASSWORD=password
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - POSTGRES_USERNAME=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_ECHO=true
      - DB_MODE=postgresql
      - KEYCLOAK_SERVER_URL=http://users.k8s.synthema.rid-intrasoft.eu/
      - KEYCLOAK_CLIENT_ID=synthema
      - KEYCLOAK_REALM_NAME=Synthema
      - MLFLOW_BASE_URL=http://mlflow
      - MLFLOW_TRACKING_USERNAME=mlflow
      - MLFLOW_TRACKING_PASSWORD=mlflowpassword
      - FL_NODES=["node1", "node2"]
      - DATA_CATALOGUE_URL=http://data-catalogue
      - AUTH_DISABLE_TESTS=True
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 1m
    deploy:
      resources:
        limits:
          cpus: "1"

  synthema-fl-test:
    image: synthema-fl-test:test
    build:
      context: ../..
      dockerfile: e2e/docker_full/Dockerfile
    container_name: synthema-fl-test
    command: ["python", "test.py"]
    depends_on:
      mlflow:
        condition: service_started
      synthema-fl-status_listener:
        condition: service_started
      synthema-fl-restapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
